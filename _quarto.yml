    center: "Vibe Coding Mastery - 3 Week Journey"

format:
  html:
    theme:
      dark: [darkly, styles.scss]
      light: [cosmo, styles.scss]
    css: styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    highlight-style: github-dark
    include-after-body: progress.html

project:
  type: website
  output-dir: docs

website:
  title: "Vibe Coding Mastery"
  description: "Learn to vibe code real apps and AI agents in 3 weeks using Google tools."
  site-url: "https://maryleneh.github.io/Vibe_coding_notes/"
  search: true
  
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: "🌍 Language / Langue"
  
  sidebar:
    - id: en
      title: "English Curriculum"
      style: "docked"
      search: true
      collapse-level: 1
      contents:
        - en/index.qmd
        - section: "Week 1: Foundations"
          href: en/week1/index.qmd
          contents:
            - en/week1/day1.qmd
            - en/week1/day2.qmd
            - en/week1/day3.qmd
            - en/week1/day4.qmd
            - en/week1/day5.qmd
            - en/week1/day6.qmd
            - en/week1/day7.qmd
        - section: "Week 2: Agents"
          href: en/week2/index.qmd
          contents:
            - en/week2/day1.qmd
            - en/week2/day2.qmd
            - en/week2/day3.qmd
            - en/week2/day4.qmd
            - en/week2/day5.qmd
            - en/week2/day6.qmd
            - en/week2/day7.qmd
        - section: "Week 3: Advanced & Deploy"
          href: en/week3/index.qmd
          contents:
            - en/week3/day1.qmd
            - en/week3/day2.qmd
            - en/week3/day3.qmd
            - en/week3/day4.qmd
            - en/week3/day5.qmd
            - en/week3/day6.qmd
            - en/week3/day7.qmd

    - id: fr
      title: "Programme Français"
      style: "docked"
      search: true
      collapse-level: 1
      contents:
        - fr/index.qmd
        - section: "Semaine 1 : Fondations"
          href: fr/week1/index.qmd
          contents:
            - fr/week1/day1.qmd
            - fr/week1/day2.qmd
            - fr/week1/day3.qmd
